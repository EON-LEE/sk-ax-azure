<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>A.X K2 고객 데모</title>
<link rel="stylesheet" href="/static/chat.css">
<script src="/static/common.js" defer></script>
<script src="/static/markdown.js" defer></script>
<script src="/static/chat.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<!-- shown only when the server is not in open-demo mode -->
<div id="login" class="login hidden">
  <form id="login-form" class="login-card" autocomplete="on">
    <h1>A.X K2 고객 데모</h1>
    <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="256"
           placeholder="비밀번호" aria-label="비밀번호" required>
    <button type="submit" class="primary">시작하기</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</div>

<div class="app">
  <header class="topbar">
    <div class="title">A.X K2 <span>고객 데모</span><span id="power" class="dot off" title="확인 중"></span></div>
    <nav class="tabs" aria-label="보기">
      <button id="chat-tab" type="button" aria-selected="false">채팅</button>
      <button id="compare-tab" type="button" aria-selected="true">모델 비교</button>
    </nav>
    <button type="button" id="new-chat" class="icon-btn" title="새 대화" aria-label="새 대화">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    </button>
  </header>

  <div class="model-slot">
    <div id="model-scope" class="model-scope inactive">
      <label for="model-select">채팅 모델</label>
      <select id="model-select" class="model-select hidden" aria-label="채팅 모델" aria-describedby="model-note">
        <option value="fp8">A.X K2 FP8</option>
        <option value="nvfp4">A.X K2 NVFP4</option>
      </select>
      <span id="model-note" class="model-note">모델 변경 시 새 대화가 시작됩니다.</span>
    </div>
  </div>

  <div id="messages" class="messages">
    <div id="welcome" class="welcome">
      <h2>무엇을 도와드릴까요?</h2>
      <div id="examples" class="suggestions"></div>
    </div>
  </div>

  <div class="dock">
    <div id="banner" class="banner hidden" role="status"></div>
    <details id="conditions" class="conditions">
      <summary>공통 조건</summary>
      <div class="condition-settings">
        <label>문맥<select id="context-mode">
          <option value="independent">독립 질문 (기본)</option>
          <option value="common">고정 공통 문맥</option>
          <option value="continue">각자 대화 이어가기</option>
        </select></label>
        <label>출력 상한<input id="output-limit" type="number" min="16" max="8192" value="2048"></label>
        <label>temperature<input id="temperature" type="number" min="0" max="2" step="0.1" value="0.6"></label>
        <label>top_p<input id="top-p" type="number" min="0.01" max="1" step="0.01" value="0.95"></label>
      </div>
      <label class="condition-text">공통 문맥·지침<textarea id="common-context" rows="2" maxlength="64000"
        placeholder="고정 공통 문맥 모드에서만 양쪽 입력에 동일하게 포함됩니다."></textarea></label>
      <p id="condition-note" class="tiny">독립 질문은 이전 답변을 입력에 넣지 않습니다. 도구를 켜면 실제 에이전트 비교이며 도구 결과는 달라질 수 있습니다.</p>
      <p id="context-limits" class="tiny">실제 문맥 한도 확인 중 · 입력과 출력 및 도구 문맥을 모두 포함합니다.</p>
    </details>
    <form id="composer" class="composer">
      <div id="attachments" class="attachments hidden"></div>
      <textarea id="input" rows="1" maxlength="200000" placeholder="무엇이든 물어보세요" aria-label="메시지"></textarea>
      <div class="composer-bar">
        <label class="icon-btn" title="문서·표·프로젝트 첨부 (PDF, DOCX, CSV, XLSX, ZIP, 텍스트)" aria-label="문서 첨부">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <input type="file" id="file" class="visually-hidden" accept=".txt,.md,.pdf,.docx,.csv,.xlsx,.zip,.html,.py,.js,.css,.json,.ts,.toml,.yml,.yaml" multiple>
        </label>
        <label class="pill" title="답하기 전에 생각하는 과정을 거칩니다">
          <input type="checkbox" id="thinking" checked><span>추론</span>
        </label>
        <label class="pill" title="MAF 파일·문서·표·계산 도구 (Web IQ·실행 샌드박스 미구성)">
          <input type="checkbox" id="tools" checked><span>도구</span>
        </label>
        <span id="hint" class="hint"></span>
        <button type="button" id="stop" class="round-btn hidden" aria-label="중지">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
        </button>
        <button type="submit" id="send" class="round-btn" aria-label="보내기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </form>
    <p class="disclaimer">A.X K2는 실수할 수 있습니다. 중요한 정보는 확인해 주세요.</p>
  </div>
</div>
</body>
</html>
