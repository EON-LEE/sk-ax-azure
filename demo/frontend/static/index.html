<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>A.X K2 고객 데모</title>
<link rel="stylesheet" href="/static/chat.css">
<script src="/static/common.js" defer></script>
<script src="/static/markdown.js" defer></script>
<script src="/static/tools.js" defer></script>
<script src="/static/chat.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<!-- shown only when the server is not in open-demo mode -->
<div id="login" class="login hidden">
  <form id="login-form" class="login-card" autocomplete="on">
    <h1>A.X K2 고객 데모</h1>
    <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="256"
           placeholder="비밀번호" aria-label="비밀번호" required>
    <button type="submit" class="primary">시작하기</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</div>

<div class="app">
  <header class="topbar">
    <div class="title">A.X K2 <span>고객 데모</span><span id="power" class="dot off" title="확인 중"></span></div>
    <button type="button" id="new-chat" class="icon-btn" title="새 대화" aria-label="새 대화">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    </button>
  </header>

  <div id="messages" class="messages">
    <div id="welcome" class="welcome">
      <h2>무엇을 도와드릴까요?</h2>
      <div id="examples" class="suggestions"></div>
    </div>
  </div>

  <div class="dock">
    <div id="banner" class="banner hidden" role="status"></div>
    <form id="composer" class="composer">
      <div id="attachments" class="attachments hidden"></div>
      <textarea id="input" rows="1" maxlength="200000" placeholder="무엇이든 물어보세요" aria-label="메시지"></textarea>
      <div class="composer-bar">
        <label class="icon-btn" title="문서 첨부 (.txt, .md)" aria-label="문서 첨부">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <input type="file" id="file" class="visually-hidden" accept=".txt,.md,text/plain,text/markdown" multiple>
        </label>
        <label class="pill" title="답하기 전에 생각하는 과정을 거칩니다">
          <input type="checkbox" id="thinking" checked><span>추론</span>
        </label>
        <label class="pill" title="계산기 · 현재 시각 · 날씨(가짜 데이터) 도구">
          <input type="checkbox" id="tools"><span>도구</span>
        </label>
        <span id="hint" class="hint"></span>
        <button type="button" id="stop" class="round-btn hidden" aria-label="중지">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
        </button>
        <button type="submit" id="send" class="round-btn" aria-label="보내기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </form>
    <p class="disclaimer">A.X K2는 실수할 수 있습니다. 중요한 정보는 확인해 주세요.</p>
  </div>
</div>
</body>
</html>
