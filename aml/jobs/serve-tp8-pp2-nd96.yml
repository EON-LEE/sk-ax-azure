$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
experiment_name: axk2-distributed-poc
display_name: serve-staged-tp8-pp2-2xND96amsr-A100
description: >-
  Variant of native-dsa-bench-nd96-hub.yml for a workspace whose private blob already holds the
  staged checkpoint (stage-full-weights.yml): the full 61-layer A.X-K2 served as ONE OpenAI-compatible
  endpoint on a Ray cluster of two 8xA100-80GB nodes (TP=8 inside each node, PP=2 across nodes) in
  each mode listed in MODES, with the full client suite. No 2-layer rehearsal.
compute: azureml:a100-nd96-lp
environment:
  image: docker.io/vllm/vllm-openai:v0.23.0-cu129
identity:
  type: user_identity
inputs:
  model:
    type: uri_folder
    mode: download
    path: azureml://datastores/workspaceblobstore/paths/axk2/weights/2287ca45/
resources:
  instance_count: 2
  shm_size: 256g
distribution:
  type: pytorch
  process_count_per_instance: 1
environment_variables:
  AXK2_SRC_B64: "__AXK2_SRC_B64__"
  MODES: "native dense"
  TP: "8"
  PP: "2"
  FULL_MAX_MODEL_LEN: "65536"
  FULL_MAX_NUM_SEQS: "128"
  FULL_GPU_MEM_UTIL: "0.90"
  FULL_HEALTH_TIMEOUT: "3600"
  RUN_KERNEL_TESTS: "0"
  JOIN_TIMEOUT: "5400"
  NCCL_IB_DISABLE: "1"
command: >-
  mkdir -p /tmp/axk2src && printenv AXK2_SRC_B64 | base64 -d | tar -xz -C /tmp/axk2src &&
  bash /tmp/axk2src/entry.sh none ${{inputs.model}}
limits:
  timeout: 14400