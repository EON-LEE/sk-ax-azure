$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
experiment_name: axk2-distributed-poc
display_name: oracle-hf-2layer-cpu
description: >-
  Official Transformers AXK2 (pinned commit, FP32, sparse DSA with index_topk=2048) prompt
  log-probabilities on the byte-exact 2-layer cut of the published checkpoint, built here from the
  Hub with the same deterministic prompts as the GPU job (including ~7.2K-token natural text, so
  most positions lie beyond index_topk). Reference for both vLLM attention modes.
compute: azureml:cpu-lp
environment:
  image: docker.io/library/python:3.12-slim
identity:
  type: user_identity
environment_variables:
  AXK2_SRC_B64: "__AXK2_SRC_B64__"
command: >-
  mkdir -p /tmp/axk2src && printenv AXK2_SRC_B64 | base64 -d | tar -xz -C /tmp/axk2src &&
  pip install -q --no-cache-dir torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu &&
  pip install -q --no-cache-dir
  https://github.com/huggingface/transformers/archive/7fb5bcd1d4b8a5c225a2c33429b2e9e023dd61ae.zip
  safetensors tokenizers "huggingface_hub[hf_xet]>=0.35" "mlflow-skinny>=2.16" azureml-mlflow &&
  python /tmp/axk2src/build_smoke_checkpoint.py --revision 2287ca456927eed33b899c404c0b2ffaf17aa09f
  --out ./ckpt --work ./source-shards > build.log 2>&1 &&
  python /tmp/axk2src/oracle_hf.py --ckpt ./ckpt --out ./outputs/oracle.json > oracle.log 2>&1 ;
  rc=$? ; tail -c 2000 build.log ; tail -c 3000 oracle.log ;
  python /tmp/axk2src/report.py oracle.log --text "$(tail -c 3500 oracle.log)" ;
  test $rc = 0 && python /tmp/axk2src/report.py oracle.summary --file ./outputs/oracle.json &&
  python /tmp/axk2src/report.py oracle --series --file ./outputs/oracle-series.json ;
  exit $rc
limits:
  timeout: 7200
