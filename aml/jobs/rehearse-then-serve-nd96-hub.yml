$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
experiment_name: axk2-distributed-poc
display_name: rehearse-then-serve-tp8-pp2-2xND96amsr-A100
description: >-
  One allocation of two 8xA100-80GB low-priority nodes does the whole validation. Every node starts
  downloading the pinned full checkpoint (694 GB) from the Hub in the background. Meanwhile the
  2-layer real-weight cut is served first on one node (TP=8) and then on a Ray cluster across both
  nodes (TP=8 x PP=2) and compared. Only if that rehearsal passes is the full 61-layer A.X-K2 served
  as one OpenAI-compatible endpoint (TP=8 over NVLink inside each node, PP=2 across nodes, dense
  mode) and tested: functional, reasoning, arithmetic, determinism, long context and load.
compute: azureml:a100-nd96-lp
environment:
  image: docker.io/vllm/vllm-openai:v0.23.0-cu129
identity:
  type: user_identity
resources:
  instance_count: 2
  shm_size: 256g
distribution:
  type: pytorch
  process_count_per_instance: 1
environment_variables:
  AXK2_SRC_B64: "__AXK2_SRC_B64__"
  SUITE: smoke
  TP: "8"
  PP: "2"
  MAX_MODEL_LEN: "4096"
  MAX_NUM_SEQS: "16"
  GPU_MEM_UTIL: "0.85"
  HEALTH_TIMEOUT: "2400"
  FULL_SOURCE: hf:2287ca456927eed33b899c404c0b2ffaf17aa09f
  FULL_MAX_MODEL_LEN: "8192"
  FULL_MAX_NUM_SEQS: "64"
  FULL_GPU_MEM_UTIL: "0.90"
  FULL_HEALTH_TIMEOUT: "3600"
  JOIN_TIMEOUT: "3600"
  EAGER: "0"
  NCCL_IB_DISABLE: "1"
command: >-
  mkdir -p /tmp/axk2src && printenv AXK2_SRC_B64 | base64 -d | tar -xz -C /tmp/axk2src &&
  bash /tmp/axk2src/entry.sh hf-smoke:2287ca456927eed33b899c404c0b2ffaf17aa09f
limits:
  timeout: 10800
