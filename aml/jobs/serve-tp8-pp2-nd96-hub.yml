$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
experiment_name: axk2-distributed-poc
display_name: hub-serve-tp8-pp2-2xND96amsr-A100
description: >-
  Variant for a region without the staged blob copy: each node pulls the pinned checkpoint from the Hub.
  Full 61-layer A.X-K2 (688B, FP8) served as ONE OpenAI-compatible endpoint by vLLM on a Ray
  cluster of two 8xA100-80GB low-priority nodes: tensor parallel 8 over NVLink inside each node,
  pipeline parallel 2 across the nodes. Stock vLLM 0.23.0 image + pinned SKT fork overlay, dense
  mode (exact DSA semantics up to 2048 tokens of context). Runs functional, accuracy, determinism,
  long-context and load tests, then shuts down.
compute: azureml:a100-nd96-lp
environment:
  image: docker.io/vllm/vllm-openai:v0.23.0-cu129
identity:
  type: user_identity
resources:
  instance_count: 2
  shm_size: 256g
distribution:
  type: pytorch
  process_count_per_instance: 1
environment_variables:
  AXK2_SRC_B64: "__AXK2_SRC_B64__"
  SUITE: full
  TP: "8"
  PP: "2"
  MAX_MODEL_LEN: "8192"
  MAX_NUM_SEQS: "64"
  GPU_MEM_UTIL: "0.90"
  EAGER: "0"
  HEALTH_TIMEOUT: "5400"
  JOIN_TIMEOUT: "5400"
  NCCL_IB_DISABLE: "1"
command: >-
  mkdir -p /tmp/axk2src && printenv AXK2_SRC_B64 | base64 -d | tar -xz -C /tmp/axk2src &&
  bash /tmp/axk2src/entry.sh hf:2287ca456927eed33b899c404c0b2ffaf17aa09f
limits:
  timeout: 10800
