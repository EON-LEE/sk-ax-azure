$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
experiment_name: axk2-demo
display_name: demo-fp8-2xND96amsr-A100
description: >-
  The public A.X K2 demo: the full 61-layer FP8 model with native DeepSeek Sparse Attention on two
  8xA100-80GB nodes (TP=8 x PP=2 over Ray, NCCL over InfiniBand when the probe finds it), the model
  card's tool-call and reasoning parsers, 256K context and priority scheduling, serving until the job
  is cancelled. Node 0 dials out to the demo frontend (backend_link.py) and relays the chat and the
  eval runner through that link; nothing listens on a public port. Submitted by the frontend's
  supervisor (demo/), which fills in the link URL and a fresh token per submission.
compute: azureml:a100-nd96-lp
environment:
  image: docker.io/vllm/vllm-openai:v0.23.0-cu129
identity:
  type: managed
resources:
  instance_count: 2
  shm_size: 256g
distribution:
  type: pytorch
  process_count_per_instance: 1
environment_variables:
  AXK2_SRC_B64: "__AXK2_SRC_B64__"
  AXK2_LINK_URL: "__AXK2_LINK_URL__"
  AXK2_LINK_TOKEN: "__AXK2_LINK_TOKEN__"
  PHASE_PLAN: "demo"
  IB_PROBE: "1"
  FULL_MAX_MODEL_LEN: "262144"
  FULL_MAX_NUM_SEQS: "64"
  FULL_GPU_MEM_UTIL: "0.90"
  FULL_HEALTH_TIMEOUT: "3600"
  DOWNLOAD_TIMEOUT: "5400"
  RUN_KERNEL_TESTS: "0"
  JOIN_TIMEOUT: "5400"
  DEMO_RESTARTS: "2"
  TP: "8"
  PP: "2"
command: >-
  mkdir -p /tmp/axk2src && printenv AXK2_SRC_B64 | base64 -d | tar -xz -C /tmp/axk2src &&
  bash /tmp/axk2src/entry.sh none hf:2287ca456927eed33b899c404c0b2ffaf17aa09f
limits:
  timeout: 604800
